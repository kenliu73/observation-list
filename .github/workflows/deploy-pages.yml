name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  schedule:
    # Auto-sync TWSE / Yahoo / MoneyDJ data on trading days (Mon-Fri):
    # 02:05, 04:05, 06:05 UTC = 10:05, 12:05, 14:05 Asia/Taipei
    - cron: '5 2,4,6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static bundle for GitHub Pages
        env:
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'
          VITE_API_BASE_URL: '${{ vars.VITE_API_BASE_URL }}'
          VITE_STATIC_DATA: '${{ vars.VITE_API_BASE_URL == "" && "true" || "false" }}'
        run: npm run build

      - name: Generate live TWSE / Yahoo / MoneyDJ JSON snapshots
        run: npx tsx scripts/build-static-data.ts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
